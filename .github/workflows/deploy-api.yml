# API → DigitalOcean App Platform (después de pasar CI en main).
name: Deploy API (DigitalOcean)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production   # exige aprobación manual si la configuras en GitHub → Environments
    steps:
      - name: Verificar secretos obligatorios
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          [ -n "$DO_TOKEN" ] || { echo "::error::Falta el secreto DIGITALOCEAN_ACCESS_TOKEN"; exit 1; }
          [ ${#SESSION_SECRET} -ge 32 ] || { echo "::error::SESSION_SECRET falta o tiene menos de 32 caracteres"; exit 1; }
      - uses: actions/checkout@v4
      - uses: digitalocean/app_action/deploy@v2
        env:   # reemplazan los ${...} de .do/app.yaml; los opcionales pueden no existir
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPACES_KEY: ${{ secrets.SPACES_KEY }}
          SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
          SES_ACCESS_KEY: ${{ secrets.SES_ACCESS_KEY }}
          SES_SECRET_KEY: ${{ secrets.SES_SECRET_KEY }}
          SES_REGION: ${{ vars.SES_REGION || 'us-east-1' }}
          SES_REMITENTE: ${{ vars.SES_REMITENTE }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/app.yaml
