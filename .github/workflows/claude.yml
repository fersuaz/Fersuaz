# Claude como desarrollador y revisor dentro de GitHub.
# - Revisión automática de cada pull request (agente "revisor").
# - Mencionar @claude en un issue o comentario para que implemente (agente "desarrollador").
# Requiere el secreto ANTHROPIC_API_KEY (o CLAUDE_CODE_OAUTH_TOKEN) y la GitHub App de Claude instalada.
name: Claude
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  revisar:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Actúa como el agente definido en .claude/agents/revisor.md.
            Revisa este pull request contra CLAUDE.md y deja comentarios en línea
            y un resumen con el veredicto final. Responde en español.

  desarrollar:
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
