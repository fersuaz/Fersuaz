<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel | FERSUAZ</title>
  <meta name="theme-color" content="#003463">
  <meta name="robots" content="noindex">
  <!-- URL pública de la API (DigitalOcean). Se completa en el despliegue. -->
  <meta name="fersuaz-api" content="">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/acceso.css">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body class="panel-body">
  <a class="skip" href="#vista">Saltar al contenido</a>
  <div class="panel" id="panel">
    <aside class="lateral" id="lateral" aria-label="Menú del panel">
      <div class="lateral-cabeza">
        <a class="lateral-logo" href="./" aria-label="FERSUAZ, inicio"><span class="logo-caja"><img src="assets/brand/fersuaz-logo-color.svg" alt="FERSUAZ Laboratorio Farmacéutico" width="150" height="42"></span></a>
        <div class="cabeza-acciones" id="cabeza-acciones">
          <button type="button" id="colapsar" class="icono-boton colapsar" aria-controls="lateral" aria-expanded="true" aria-label="Colapsar menú">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9 4.5v15"/><path class="flecha" d="m15.5 10-2 2 2 2"/></svg>
          </button>
          <button type="button" id="cerrar-menu" class="icono-boton cerrar-menu" aria-label="Cerrar menú">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>
      <nav id="menu" aria-label="Secciones"></nav>
      <div class="lateral-pie">
        <nav id="menu-pie" aria-label="Utilidades"></nav>
        <div class="perfil">
          <button type="button" id="perfil" class="perfil-boton" aria-haspopup="true" aria-expanded="false" aria-controls="perfil-menu" aria-label="Tu cuenta" data-tip="Tu cuenta">
            <span class="avatar" id="avatar" aria-hidden="true"></span>
            <span class="perfil-texto"><span id="usuario-nombre"></span><span id="usuario-rol"></span></span>
            <svg class="perfil-flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4-4 4 4M8 14l4 4 4-4"/></svg>
          </button>
          <div id="perfil-menu" class="perfil-menu" hidden>
            <p class="perfil-menu-nombre" id="perfil-nombre"></p>
            <p class="perfil-menu-correo" id="perfil-correo"></p>
            <button type="button" class="perfil-salir" id="salir">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>
              Cerrar sesión
            </button>
          </div>
        </div>
      </div>
    </aside>
    <div class="velo" id="velo" hidden></div>
    <div class="contenido">
    <header class="topbar" aria-label="Barra superior">
      <button type="button" id="abrir-menu" class="icono-boton" aria-controls="lateral" aria-expanded="false" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="topbar-logo" href="./" aria-label="FERSUAZ, inicio"><img src="assets/brand/fersuaz-logo-color.svg" alt="FERSUAZ Laboratorio Farmacéutico" width="120" height="34"></a>
      <div class="topbar-derecha" id="topbar-campana">
        <div class="campana" id="campana-caja">
          <button type="button" id="campana" class="campana-boton" aria-haspopup="true" aria-expanded="false" aria-controls="campana-panel" aria-label="Notificaciones" data-tip="Notificaciones">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
            <span id="campana-cuenta" class="campana-cuenta" hidden></span>
          </button>
          <div id="campana-panel" class="campana-panel" hidden>
            <div class="campana-titulo"><h2>Notificaciones</h2><button type="button" class="enlace" id="campana-todas">Marcar todas como leídas</button></div>
            <ul id="campana-lista" class="campana-lista"></ul>
          </div>
        </div>
      </div>
    </header>
    <main id="vista" class="vista" tabindex="-1" aria-live="polite">
      <p class="cargando">Cargando tu panel…</p>
    </main>
    </div>
  </div>
  <dialog id="dialogo" class="dialogo" aria-labelledby="dialogo-titulo">
    <form method="dialog" id="dialogo-form">
      <h2 id="dialogo-titulo">Confirmar</h2>
      <div id="dialogo-cuerpo"></div>
      <div class="dialogo-botones">
        <button type="submit" value="cancelar" class="btn-sec">Cancelar</button>
        <button type="submit" value="ok" class="btn" id="dialogo-ok">Confirmar</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="js/panel.js"></script>
</body>
</html>
