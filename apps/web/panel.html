<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel | FERSUAZ</title>
  <meta name="theme-color" content="#003463">
  <meta name="robots" content="noindex">
  <!-- URL pública de la API (DigitalOcean). Se completa en el despliegue. -->
  <meta name="fersuaz-api" content="">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/acceso.css">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body class="panel-body">
  <a class="skip" href="#vista">Saltar al contenido</a>
  <div class="panel">
    <aside class="lateral" aria-label="Menú del panel">
      <a class="lateral-logo" href="./" aria-label="FERSUAZ, inicio"><img src="assets/brand/fersuaz-logo-color.svg" alt="FERSUAZ Laboratorio Farmacéutico" width="150" height="42"></a>
      <nav id="menu" aria-label="Secciones"></nav>
      <div class="lateral-usuario">
        <p id="usuario-nombre"></p>
        <p id="usuario-rol"></p>
        <button type="button" class="enlace" id="salir">Cerrar sesión</button>
      </div>
    </aside>
    <main id="vista" class="vista" tabindex="-1" aria-live="polite">
      <p class="cargando">Cargando tu panel…</p>
    </main>
  </div>
  <dialog id="dialogo" class="dialogo" aria-labelledby="dialogo-titulo">
    <form method="dialog" id="dialogo-form">
      <h2 id="dialogo-titulo">Confirmar</h2>
      <div id="dialogo-cuerpo"></div>
      <div class="dialogo-botones">
        <button type="submit" value="cancelar" class="btn-sec">Cancelar</button>
        <button type="submit" value="ok" class="btn" id="dialogo-ok">Confirmar</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="js/panel.js"></script>
</body>
</html>
