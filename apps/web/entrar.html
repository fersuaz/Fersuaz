<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | FERSUAZ</title>
  <meta name="theme-color" content="#003463">
  <meta name="fersuaz-api" content="">
  <link rel="manifest" href="manifest.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="bar"><a class="brand" href="./" aria-label="FERSUAZ, inicio"><img src="assets/brand/fersuaz-logo-color.svg" alt="FERSUAZ Laboratorio Farmacéutico" width="180" height="51"></a><nav><a class="bar-cta" href="registro.html">Solicitar una cuenta</a></nav></header>
  <main class="form-page">
    <aside class="form-aside"><h1>Bienvenido de vuelta</h1><p>Entra con el correo que usaste al solicitar tu cuenta.</p></aside>
    <section class="form-main">
      <form id="entrar" novalidate>
        <div class="field"><label for="email">Correo</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn" type="submit" id="submit">Iniciar sesión</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script type="module">
    import { apiBase } from './js/api.js';
    const f = document.getElementById('entrar'), s = document.getElementById('status'), b = document.getElementById('submit');
    const say = (k, t) => { s.dataset.kind = k; s.textContent = t; };
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!f.email.value || !f.password.value) return say('error', 'Escribe tu correo y tu contraseña.');
      const base = apiBase();
      if (!base) return say('error', 'El inicio de sesión todavía no está conectado al servidor.');
      b.disabled = true; b.textContent = 'Entrando…';
      try {
        const r = await fetch(`${base}/api/auth/login`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: f.email.value, password: f.password.value }) });
        const body = await r.json().catch(() => ({}));
        if (!r.ok) return say('error', body.error ?? 'No pudimos iniciar tu sesión.');
        sessionStorage.setItem('fersuaz.token', body.token);
        say('ok', `Hola, ${body.user.fullName}. Tu panel llegará en el próximo módulo.`);
      } catch { say('error', 'No pudimos conectar con el servidor. Revisa tu conexión e intenta de nuevo.'); }
      finally { b.disabled = false; b.textContent = 'Iniciar sesión'; }
    });
  </script>
</body>
</html>
