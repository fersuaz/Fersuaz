# DigitalOcean App Platform. El balanceador lo incluye App Platform.
# Los valores ${NOMBRE} los reemplaza GitHub Actions (digitalocean/app_action) con los GitHub Secrets
# del mismo nombre; ${fersuaz-db.*} los resuelve DigitalOcean. Ningún secreto vive en este archivo.
name: fersuaz-api
region: nyc
services:
  - name: api
    github:
      repo: fersuaz/Fersuaz
      branch: main
      deploy_on_push: false   # lo dispara GitHub Actions tras pasar CI
    source_dir: apps/api
    environment_slug: node-js
    run_command: npm start
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    # Empieza con 1. Sube a 2 o más (hasta los 10 previstos) SOLO cuando Spaces esté configurado,
    # porque sin Spaces cada servidor guarda los comprobantes en su propio disco.
    instance_count: 1
    health_check: { http_path: /api/health }
    routes: [{ path: /api, preserve_path_prefix: true }]   # la API recibe /api/... completo
    envs:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, scope: RUN_TIME, value: "${fersuaz-db.DATABASE_URL}" }
      - { key: DATABASE_CA, scope: RUN_TIME, value: "${fersuaz-db.CA_CERT}" }
      - { key: SESSION_SECRET, scope: RUN_TIME, type: SECRET, value: "${SESSION_SECRET}" }
      - { key: ALLOWED_ORIGINS, scope: RUN_TIME, value: "https://fersuaz.net,https://www.fersuaz.net,https://fersuaz-web.pages.dev" }
      # Opcionales: si están vacíos, los km se escriben a mano y los archivos van al disco local.
      - { key: MAPS_API_KEY, scope: RUN_TIME, type: SECRET, value: "${MAPS_API_KEY}" }
      # Opcional: lectura de facturas, PDF y fotos de ventas con inteligencia artificial (Claude). Sin clave, solo la plantilla de Excel.
      - { key: ANTHROPIC_API_KEY, scope: RUN_TIME, type: SECRET, value: "${ANTHROPIC_API_KEY}" }
      - { key: SPACES_KEY, scope: RUN_TIME, type: SECRET, value: "${SPACES_KEY}" }
      - { key: SPACES_SECRET, scope: RUN_TIME, type: SECRET, value: "${SPACES_SECRET}" }
      - { key: SPACES_BUCKET, scope: RUN_TIME, value: fersuaz-archivos }
      - { key: SPACES_REGION, scope: RUN_TIME, value: nyc3 }
      # Correos con Amazon SES (opcionales: sin ellos, solo hay notificaciones en la campana)
      - { key: SES_ACCESS_KEY, scope: RUN_TIME, type: SECRET, value: "${SES_ACCESS_KEY}" }
      - { key: SES_SECRET_KEY, scope: RUN_TIME, type: SECRET, value: "${SES_SECRET_KEY}" }
      - { key: SES_REGION, scope: RUN_TIME, value: "${SES_REGION}" }
      - { key: SES_REMITENTE, scope: RUN_TIME, value: "${SES_REMITENTE}" }
      - { key: SITIO_URL, scope: RUN_TIME, value: "https://fersuaz-web.pages.dev" }
jobs:
  # Aplica las migraciones nuevas antes de cada despliegue. Si una falla, el despliegue se detiene.
  - name: migrar
    kind: PRE_DEPLOY
    github: { repo: fersuaz/Fersuaz, branch: main, deploy_on_push: false }
    source_dir: apps/api
    environment_slug: node-js
    run_command: npm run migrar
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - { key: DATABASE_URL, scope: RUN_TIME, value: "${fersuaz-db.DATABASE_URL}" }
      - { key: DATABASE_CA, scope: RUN_TIME, value: "${fersuaz-db.CA_CERT}" }
databases:
  - name: fersuaz-db
    engine: PG
    production: true
    cluster_name: fersuaz-db   # crear antes en DigitalOcean → Databases
